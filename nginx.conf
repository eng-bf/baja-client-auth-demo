server {
    listen 5180;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes like /callback (the OAuth redirect
    # target) must resolve to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed assets Vite emits; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
